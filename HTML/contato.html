<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Contato | Wallace</title>
</head>
<body>

    <header>
        <div class="interface">
            <div class="logo">
                <a href="../index.html">
                    <img src="../IMG/logo.png" alt="Logo do site">
                </a>
            </div>

            <nav class="menu-desktop">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="../HTML/sobre.html">Sobre</a></li>
                    <li><a href="./portfolio.html">Portfólio</a></li>
                    <li><a href="./novidades.html">Novidades</a></li>
                </ul>
            </nav>

            <div class="btn-contato">
                <a href="./contato.html"><button>Contato</button></a>
            </div>
        </div>
    </header>

    <main>
        <div class="contato-wrapper">
            <div class="contato-box">
                <span class="secao-label">Fale comigo</span>
                <h2>Entre em contato comigo.</h2>

                <form action="">
                    <input type="text" placeholder="Seu nome" required>
                    <input type="email" placeholder="Seu e-mail" required>
                    <input type="tel" placeholder="Seu celular">
                    <textarea placeholder="Escreva sua mensagem" required></textarea>
                    <div class="btn-enviar">
                        <input type="submit" value="Enviar mensagem">
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="logo-footer">
                <img src="../IMG/logo.png" alt="Logo">
            </div>
            <div class="btn-redes-sociais">
                <a href="https://www.instagram.com/wallacecalisto?igsh=MTJpZWdmenhvb2kzdQ==">
                    <button><i class="fab fa-instagram"></i></button>
                </a>
                <a href="https://www.facebook.com/share/15w3HHzrkz/">
                    <button><i class="fab fa-facebook"></i></button>
                </a>
            </div>
        </div>
        <div class="footer-copy">
            <p>&copy; 2025 Wallace Calisto da Silva Santos</p>
            <a href="mailto:w.calisto@yahoo.com.br">
                <i class="bi bi-envelope-at"></i> w.calisto@yahoo.com.br
            </a>
        </div>
    </footer>

</body>
</html>
